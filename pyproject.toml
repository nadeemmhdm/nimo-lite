[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nimo-lite"
version = "0.2.0"
description = "Local-first personal AI workbench with original trainable models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pillow>=10.4", "psutil>=6", "numpy>=1.26", "httpx>=0.27,<1", "torch>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
video = ["opencv-python-headless>=4.10"]

[project.scripts]
nimo-lite = "nimo.app:main"

[tool.setuptools.package-data]
nimo = ["static/*", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["nimo*"]
namespaces = false
