[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimo-lite"
version = "0.1.0"
description = "Local-first experimental AI training workbench with original tiny models"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pillow>=10.4", "psutil>=6", "numpy>=1.26", "httpx>=0.27,<1", "torch>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
video = ["opencv-python-headless>=4.10"]

[project.scripts]
nimo-lite = "nimo.app:main"

[tool.setuptools.package-data]
nimo = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
