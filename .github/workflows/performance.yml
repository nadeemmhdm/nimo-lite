name: performance
on:
  push:
    branches: ['perf/max-local-inference']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - name: Benchmark Nimo Small
        run: python -m nimo.benchmark --profile small --context 1024 --prompt-tokens 128 --new-tokens 24 --repeats 2 --output benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: nimo-performance
          path: benchmark-results.json
